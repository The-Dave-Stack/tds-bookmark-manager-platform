name: CI

# --- Triggers ---
# Defines the events that will cause this workflow to run automatically.
on:
  push:
    branches:
      - main
  # Runs the workflow on any new pull request or when a pull request is updated (e.g., new commits are pushed).
  pull_request:

# --- Permissions ---
# Defines the permissions granted to the GITHUB_TOKEN for this workflow run.
# It's a security best practice to grant the minimum permissions required.
permissions:
  actions: read   # Required for 'nrwl/nx-set-shas' to read commit data.
  contents: read  # Required for 'actions/checkout' to read the repository content.

# --- Jobs ---
# A workflow run is made up of one or more jobs, which run in parallel by default.
jobs:
  # Defines a single job named 'main'.
  main:
    # Specifies the type of runner machine to use for this job.
    runs-on: ubuntu-latest

    # --- Steps ---
    # A job contains a sequence of tasks called steps. Steps can run commands or use pre-built actions.
    steps:

      # Step 1: Check out the repository's code so the workflow can access it.
      - uses: actions/checkout@v4
        with:
          # Fetches the entire git history. This is required for 'nx affected'
          # to accurately compare the current state against the 'main' branch.
          fetch-depth: 0

      # Step 2: Set up the Node.js environment.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Step 3: Install project dependencies.
      - run: npm ci --legacy-peer-deps
        # 'npm ci' is used instead of 'npm install' for CI environments. It ensures a clean,
        # reproducible install based on the package-lock.json file.
        # '--legacy-peer-deps' is added to prevent installation errors from potential
        # peer dependency conflicts in the project.

      # Step 4: Install Playwright browsers and dependencies for E2E tests.
      - run: npx playwright install --with-deps

      # Step 5: A crucial Nx helper action for CI environments.
      - uses: nrwl/nx-set-shas@v4
        # This action determines the correct base and head commit SHAs that 'nx affected'
        # will use for its comparison. It handles differences between push and pull_request events.

      # Step 6: Run tasks on AFFECTED projects.
      - run: npx nx affected -t lint test build e2e
        # This is the core command of the CI pipeline.
        # 'nx affected' calculates which projects in the monorepo were affected by the code changes.
        # '-t lint test build e2e' tells Nx to run the 'lint', 'test', 'build', and 'e2e' targets,
        # but ONLY for the projects that were affected. This saves a massive amount of time,
        # as it avoids re-testing and re-building every application on every commit.
