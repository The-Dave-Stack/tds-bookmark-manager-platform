name: Publish Docker images (on main push)

# This workflow runs on every push to the 'main' branch.
on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-docker-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        # Added 'migrations' to the matrix
        app: [api, ui, migrations]
        include:
          - app: api
            project: "@tds/tds-bookmark-manager-api"
            dockerfile: "apps/backend/tds-bookmark-manager-api/Dockerfile"
            image_name: "The-Dave-Stack/tds-bookmark-manager-api" # <-- Specific name
          - app: ui
            project: "@tds/tds-bookmark-manager-ui"
            dockerfile: "apps/ui/tds-bookmark-manager-ui/Dockerfile"
            image_name: "The-Dave-Stack/tds-bookmark-manager-ui" # <-- Specific name
          - app: migrations
            # The Nx project affecting migrations is the API itself
            project: "@tds/tds-bookmark-manager-api"
            dockerfile: "apps/backend/tds-bookmark-manager-api/Dockerfile.migrate"
            image_name: "The-Dave-Stack/tds-bookmark-manager-migrations" # <-- Specific name

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive appropriate SHAs for `nx affected` commands
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'main'

      - name: Get affected projects
        id: affected-projects
        run: |
          PROJECTS=$(npx nx affected --target=docker-build --base=${{ env.NX_BASE }} --head=${{ env.NX_HEAD }} --json | jq -r '.tasks[].target.project' | jq -R . | jq -s .)
          echo "Affected projects for docker-build: $PROJECTS"
          echo "projects=$PROJECTS" >> $GITHUB_OUTPUT

      - name: Log in to the Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Use the image name defined in the matrix
          images: ${{ env.REGISTRY }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=branch,pattern=main,latest=true
            type=sha,prefix=

      - name: Build and push Docker image for ${{ matrix.app }}
        id: build-and-push
        if: ${{ contains(fromJSON(steps.affected-projects.outputs.projects), matrix.project) }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max